# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  workflow_dispatch:
  push:
    # Pattern matched against refs/tags
    tags:
      - 'v*'           # Push events to every version tag

jobs:
  deploy:

    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # PyPI trusted publishing
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11.x'
    - name: Set up uv
      uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
    - name: Build package
      run: uv build
    - name: Smoke-test built package
      # run outside the checkout so the source tree's fastembed/ can't shadow the installed wheel
      working-directory: ${{ runner.temp }}
      run: |
        python -m venv smoke-venv
        smoke-venv/bin/pip install --quiet "$GITHUB_WORKSPACE"/dist/*.whl
        smoke-venv/bin/python -c "
        from fastembed import TextEmbedding
        embedding = next(iter(TextEmbedding('sentence-transformers/all-MiniLM-L6-v2').embed(['hello world'])))
        assert embedding.shape == (384,), embedding.shape
        print('Smoke test OK')
        "
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
