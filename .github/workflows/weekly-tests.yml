name: Weekly tests

# PR runs test one representative model per family, scheduled and manual runs test every model,
# see is_manual_run in tests/utils.py
on:
  schedule:
    - cron: '17 3 * * 1' # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:

    # linux runners have 16 GB of RAM, enough for every model tested in ci (colpali is skipped in ci,
    # gpu tests are skipped everywhere)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    name: Python 3.14 weekly test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.x'
      - name: Install dependencies
        run: |
          python -m pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi --without dev,docs

      - name: Run pytest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          poetry run pytest --durations=20
