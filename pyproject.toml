[project]
name = "fastembed"
version = "0.9.1"
description = "Fast, light, accurate library built for retrieval embedding generation"
authors = [{name = "Qdrant Team", email = "info@qdrant.tech"}, {name = "NirantK", email = "nirant.bits@gmail.com"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
keywords = ["vector", "embedding", "neural", "search", "qdrant", "sentence-transformers"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11.0"
dependencies = [
    "numpy>=1.21 ; python_version == '3.11'",
    "numpy>=1.26 ; python_version == '3.12'",
    "numpy>=2.1.0 ; python_version == '3.13'",
    "numpy>=2.3.0 ; python_version >= '3.14'",
    "onnxruntime>=1.17.0,!=1.20.0,!=1.24.0,!=1.24.1 ; python_version >= '3.11' and python_version < '3.13'",
    "onnxruntime>1.21.0,!=1.24.0,!=1.24.1 ; python_version == '3.13'",
    "onnxruntime>=1.24.2 ; python_version >= '3.14'",
    "tqdm>=4.66,<5",
    "requests>=2.31,<3",
    "tokenizers>=0.20,<1.0",
    "huggingface-hub>=0.20,<3.0",
    "loguru>=0.7.2,<0.8",
    "pillow>=10.3.0,<14.0 ; python_version >= '3.11' and python_version < '3.13'",
    "pillow>=11.0.0,<14.0 ; python_version == '3.13'",
    "pillow>=12.0.0,<14.0 ; python_version >= '3.14'",
    "mmh3>=4.1.0,<6.0.0",
    "py-rust-stemmers>=0.1.0,<0.2",
]

[project.urls]
Homepage = "https://github.com/qdrant/fastembed"
Repository = "https://github.com/qdrant/fastembed"

[dependency-groups]
test = [
    "pytest>=7.4.2,<10.0.0",
    "ruff>=0.3.1,<1.0",
]
dev = [
    "notebook>=7.0.2",
    "pre-commit>=3.6.2,<5.0.0",
    "onnx>=1.15.0 ; python_version >= '3.11' and python_version < '3.13'",
    "onnx>=1.18.0 ; python_version == '3.13'",
    "onnx>=1.20.0 ; python_version >= '3.14'",
]
docs = [
    "mkdocs-material>=9.5.10,<10",
    "mkdocstrings>=0.24,<1.1",
    "pillow>=10.3.0,<14.0.0",
    "cairosvg>=2.7.1,<3",
    "mknotebooks>=0.8.0,<0.9",
]
types = [
    "pyright>=1.1.293",
    "mypy>=1,<3",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = "fastembed"
module-root = ""

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 99
